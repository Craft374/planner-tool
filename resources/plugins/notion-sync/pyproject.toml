[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-sync"
version = "1.0.0"
description = "Notion 기획 문서를 로컬 Markdown으로 단방향 동기화"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notion-sync = "notion_sync.cli:main"

[tool.setuptools]
packages = ["notion_sync"]
